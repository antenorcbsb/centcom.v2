<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocorrências ativas · Concelho de Braga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ============ CONFIGURAÇÃO VISUAL ============ */
:root{
  --fundo:#0D1826;
  --painel:#132235;
  --painel-2:#1A2C43;
  --linha:#263C57;
  --texto:#E8EEF5;
  --suave:#93A6BC;
  --azul:#3C8DFF;
  --vermelho:#E5483B;
  --laranja:#F07D2B;
  --ambar:#F2B13A;
  --verde:#3DBE7A;
  --cinza:#7D8CA0;
  --titulo:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --corpo:'Barlow','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--fundo);color:var(--texto);font-family:var(--corpo);
  font-size:15px;line-height:1.4;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  display:flex;flex-direction:column;overflow:hidden;
}
 
/* ============ BARRA SUPERIOR ============ */
.barra{
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:var(--painel);border-bottom:3px solid var(--vermelho);
  flex:0 0 auto;
}
.emblema{height:48px;width:auto}
.emblema-alt{
  height:44px;width:44px;border-radius:50%;border:2px solid var(--ambar);
  display:none;align-items:center;justify-content:center;
  font-family:var(--titulo);font-weight:700;font-size:13px;color:var(--ambar)
}
.titulos h1{font-family:var(--titulo);font-weight:700;font-size:26px;letter-spacing:.3px;line-height:1.05}
.titulos p{color:var(--suave);font-size:14px}
.relogio{margin-left:auto;text-align:right}
.relogio .hora{font-family:var(--titulo);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.relogio .data{color:var(--suave);font-size:13px}
 
/* ============ CORPO ============ */
.corpo{flex:1 1 auto;display:grid;grid-template-columns:minmax(320px,400px) 1fr;min-height:0}
.lateral{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--linha)}
 
.filtros{
  display:flex;gap:10px;align-items:center;padding:10px 14px;
  background:var(--painel);border-bottom:1px solid var(--linha)
}
.filtros select{
  flex:1;min-width:0;background:var(--painel-2);color:var(--texto);
  border:1px solid var(--linha);border-radius:6px;padding:7px 10px;font:inherit;font-size:14px
}
.filtros select:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
.contador{
  font-family:var(--titulo);font-weight:700;font-size:26px;line-height:1;
  min-width:44px;text-align:center;padding:4px 8px;border-radius:6px;
  background:var(--painel-2);border:1px solid var(--linha)
}
.contador.ativo{background:var(--vermelho);border-color:var(--vermelho)}
 
.estado-ligacao{padding:6px 14px;font-size:12.5px;color:var(--suave);border-bottom:1px solid var(--linha)}
.estado-ligacao.erro{color:#FFB4AC;background:rgba(229,72,59,.12)}
.acoes{display:flex;gap:8px;padding:8px 14px;background:var(--painel);border-bottom:1px solid var(--linha)}
.btn{
  flex:1;background:var(--painel-2);color:var(--texto);border:1px solid var(--linha);border-radius:6px;
  padding:6px 8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer
}
.btn:hover{border-color:var(--azul)}
.btn:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
#btnAlertas.convite{border-color:var(--ambar);color:var(--ambar)}
.frescura{padding:9px 14px;font-weight:600;font-size:13.5px;line-height:1.3}
.frescura.laranja{background:var(--laranja);color:#1a0d00}
.frescura.vermelho{background:var(--vermelho);color:#fff}
.lista.velha{outline:3px solid var(--vermelho);outline-offset:-3px}
.secao{font-family:var(--titulo);font-weight:600;font-size:15px;color:var(--suave);
  text-transform:uppercase;letter-spacing:.5px;padding:8px 2px 0}
.oc.viz{opacity:.78}
.oc.viz .natureza{font-size:17px}
.nova{
  display:inline-block;margin-right:6px;font-family:var(--corpo);font-size:11px;font-weight:700;
  background:var(--vermelho);color:#fff;border-radius:3px;padding:1px 5px;vertical-align:3px;
  animation:pisca 1s steps(2,start) infinite
}
.oc.alerta{animation:destaque 1.2s ease-in-out 4}
@keyframes pisca{to{visibility:hidden}}
@keyframes destaque{50%{background:rgba(229,72,59,.35)}}
.marcador.viz .ponto{inset:5px;opacity:.75;border-width:1.5px}
.rotulo-freg{background:none;border:0}
.rotulo-freg span{
  display:block;transform:translate(-50%,-50%);width:max-content;max-width:110px;text-align:center;
  font-family:var(--corpo);font-size:10.5px;font-weight:600;line-height:1.15;color:#16324F;
  text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff;pointer-events:none
}
.rotulo-freg.realce span{font-size:12.5px;color:#0B4FB3}
@media (prefers-reduced-motion:reduce){.nova,.oc.alerta{animation:none}}
 
.lista{flex:1 1 auto;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
 
.oc{
  display:grid;grid-template-columns:5px 1fr;background:var(--painel);
  border:1px solid var(--linha);border-radius:6px;overflow:hidden;cursor:pointer;
  text-align:left;color:inherit;font:inherit;width:100%
}
.oc:hover,.oc.sel{border-color:var(--azul)}
.oc:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
.oc .faixa{background:var(--c,var(--cinza))}
.oc .conteudo{padding:9px 12px}
.oc .topo{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.oc .natureza{font-family:var(--titulo);font-weight:600;font-size:19px;line-height:1.1}
.oc .chip{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;
  color:var(--c,var(--cinza));border:1px solid var(--c,var(--cinza));white-space:nowrap
}
.oc .local{color:var(--suave);font-size:13.5px;margin-top:3px}
.oc .rodape{display:flex;gap:14px;margin-top:7px;font-size:13px;align-items:center;flex-wrap:wrap}
.oc .meio{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.oc .meio svg{width:15px;height:15px;fill:var(--suave)}
.oc .inicio{margin-left:auto;color:var(--suave)}
.oc .dist{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.oc .q{font-size:12.5px;padding:2px 8px;border-radius:4px;background:var(--painel-2);border:1px solid var(--linha);font-variant-numeric:tabular-nums;color:var(--suave)}
.oc .q b{color:var(--texto);font-weight:600;margin-right:4px}
.oc .q.perto{border-color:var(--verde);color:var(--texto)}
.oc .q.perto b{color:var(--verde)}
.quartel{
  font-family:var(--titulo);font-weight:700;font-size:13px;line-height:1;color:#fff;
  background:#14324F;border:2px solid #fff;border-radius:4px;padding:4px 6px;
  box-shadow:0 1px 4px rgba(0,0,0,.45);white-space:nowrap;transform:translate(-50%,-50%);display:inline-block
}
 
.vazio{margin:auto;text-align:center;color:var(--suave);padding:30px 16px}
.vazio strong{display:block;font-family:var(--titulo);font-size:21px;color:var(--texto);margin-bottom:4px}
 
.nota{padding:8px 14px;font-size:11.5px;color:var(--suave);border-top:1px solid var(--linha);background:var(--painel)}
 
/* ============ MAPA ============ */
.mapa-wrap{position:relative;min-height:0}
#mapa{position:absolute;inset:0;background:#dfe5ea}
.legenda{
  position:absolute;right:12px;bottom:12px;z-index:500;background:rgba(19,34,53,.92);
  border:1px solid var(--linha);border-radius:6px;padding:8px 12px;font-size:12.5px;
  display:flex;flex-direction:column;gap:4px
}
.legenda span{display:flex;align-items:center;gap:7px}
.legenda i{width:11px;height:11px;border-radius:50%;background:var(--c)}
 
.marcador{position:relative;width:22px;height:22px}
.marcador .ponto{
  position:absolute;inset:3px;border-radius:50%;background:var(--c);
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)
}
.marcador.pulsa::before{
  content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);
  animation:pulso 1.8s ease-out infinite
}
.marcador.sel .ponto{inset:0;border-width:3px}
@keyframes pulso{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.marcador.pulsa::before{animation:none;opacity:.35;transform:scale(1.5)}}
 
.leaflet-popup-content-wrapper{border-radius:6px}
.leaflet-popup-content{font-family:var(--corpo);font-size:13.5px;margin:10px 12px;color:#14202E}
.leaflet-popup-content b{font-family:var(--titulo);font-size:17px}
 
/* ============ ECRÃS PEQUENOS ============ */
@media (max-width:820px){
  body{overflow:auto}
  .corpo{grid-template-columns:1fr;grid-template-rows:auto auto}
  .mapa-wrap{height:55vh}
  .lateral{border-right:0;border-bottom:1px solid var(--linha)}
  .lista{max-height:none;overflow:visible}
  .mapa-wrap{order:-1}
  .relogio .data{display:none}
  .titulos h1{font-size:22px}
}
</style>
</head>
<body>
 
<header class="barra">
  <img class="emblema" id="emblema" alt="Emblema CENTCOM">
  <div class="emblema-alt" id="emblemaAlt">BSB</div>
  <div class="titulos">
    <h1>Ocorrências ativas</h1>
    <p>Concelho de Braga · CENTCOM</p>
  </div>
  <div class="relogio">
    <div class="hora" id="hora">--:--:--</div>
    <div class="data" id="data"></div>
  </div>
</header>
 
<main class="corpo">
  <section class="lateral" aria-label="Lista de ocorrências">
    <div class="filtros">
      <label for="freguesia" class="sr" style="position:absolute;left:-9999px">Freguesia</label>
      <select id="freguesia">
        <option value="">Todas as freguesias</option>
      </select>
      <div class="contador" id="contador" title="Ocorrências no concelho de Braga">0</div>
    </div>
    <div class="acoes">
      <button type="button" class="btn" id="btnAlertas" aria-pressed="false">🔕 Ativar alertas</button>
      <button type="button" class="btn" id="btnVizinhos" aria-pressed="false">Concelhos vizinhos</button>
    </div>
    <div class="frescura" id="frescura" hidden></div>
    <div class="estado-ligacao" id="estadoLigacao">A ligar…</div>
    <div class="lista" id="lista" aria-live="polite"></div>
    <div class="nota">Fonte: Fogos.pt (dados ANEPC). Apoio à consciência situacional — não substitui os canais oficiais nem o sistema de despacho.</div>
  </section>
 
  <section class="mapa-wrap" aria-label="Mapa do concelho de Braga">
    <div id="mapa"></div>
    <div class="legenda">
      <span><i style="--c:var(--ambar)"></i>Despacho</span>
      <span><i style="--c:var(--vermelho)"></i>Em curso / chegada ao TO</span>
      <span><i style="--c:var(--verde)"></i>Em resolução / vigilância</span>
      <span><i style="--c:var(--cinza)"></i>Conclusão</span>
    </div>
  </section>
</main>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =====================================================
   CONFIGURAÇÃO — alterar só aqui
   ===================================================== */
const CONFIG = {
  // Endereço /exec do Apps Script "Intermediario Fogos"
  ENDPOINT: 'https://script.google.com/macros/s/AKfycbzVvoPqEBcY0HkyDbSXyqSOCy3b4pTg7KEIBXsAo7qow5B8hjlM3-QdAckbgfySf2iupA/exec',
  DICO: '0303',                 // concelho de Braga
  ATUALIZAR_SEG: 120,
  EMBLEMA: 'emblema.png',       // ficheiro do emblema no repositório
  // Limites aproximados do concelho (usados se o contorno não carregar)
  LIMITES_RESERVA: [[41.465, -8.535], [41.625, -8.305]],
  // Quartéis: colar as coordenadas do Google Maps (clique direito no quartel > copiar números)
  QUARTEIS: [
    { sigla: 'BSB', nome: 'Batalhão de Sapadores Bombeiros de Braga', lat: 41.569028, lng: -8.427222 },
    { sigla: 'BVB', nome: 'Bombeiros Voluntários de Braga',           lat: 41.519139, lng: -8.421139 }
  ],
  DISTANCIA_ESTRADA: true,      // true = distância e tempo por estrada (OSRM); false = só linha reta
  // Código de acesso ao intermediário (igual à propriedade ACESSO_PAGINA no Apps Script; vazio = sem código)
  CHAVE_ACESSO: '',
  // Concelhos vizinhos (botão "Concelhos vizinhos")
  VIZINHOS: { '0301':'Amares', '0302':'Barcelos', '0308':'Guimarães', '0309':'Póvoa de Lanhoso',
              '0312':'Vila Nova de Famalicão', '0313':'Vila Verde' },
  ALERTA_NOVA_MIN: 10,          // minutos com a etiqueta "NOVA"
  DADOS_LARANJA_MIN: 10,        // aviso laranja: dados com mais de X min
  DADOS_VERMELHO_MIN: 20        // aviso vermelho: dados com mais de X min
};

/* ---------- Freguesias do concelho de Braga (37) ---------- */
const FREGUESIAS = [
  'Adaúfe','Arentim e Cunha','Braga (Maximinos, Sé e Cividade)','Braga (São José de São Lázaro e São João do Souto)',
  'Braga (São Vicente)','Braga (São Víctor)','Cabreiros e Passos (São Julião)','Celeirós, Aveleda e Vimieiro',
  'Crespos e Pousada','Escudeiros e Penso (Santo Estêvão e São Vicente)','Espinho','Esporões',
  'Este (São Pedro e São Mamede)','Ferreiros e Gondizalves','Figueiredo','Gualtar','Guisande e Oliveira (São Pedro)',
  'Lamas','Lomar e Arcos','Merelim (São Paio), Panoias e Parada de Tibães','Merelim (São Pedro) e Frossos',
  'Mire de Tibães','Morreira e Trandeiras','Nogueira, Fraião e Lamaçães','Nogueiró e Tenões','Padim da Graça',
  'Palmeira','Pedralva','Priscos','Real, Dume e Semelhe','Ruilhe','Santa Lucrécia de Algeriz e Navarra',
  'Sequeira','Sobreposta','Tadim','Tebosa','Vilaça e Fradelos'
];
 
/* ---------- Estados (códigos Fogos.pt) ---------- */
const ESTADOS = {
  3:{nome:'Despacho',cor:'--ambar',ordem:3},
  4:{nome:'Despacho de 1.º alerta',cor:'--ambar',ordem:3},
  5:{nome:'Em curso',cor:'--vermelho',ordem:1,pulsa:true},
  6:{nome:'Chegada ao TO',cor:'--laranja',ordem:2,pulsa:true},
  7:{nome:'Em resolução',cor:'--verde',ordem:4},
  8:{nome:'Conclusão',cor:'--cinza',ordem:6},
  9:{nome:'Vigilância',cor:'--verde',ordem:5},
  10:{nome:'Encerrada',cor:'--cinza',ordem:7},
  11:{nome:'Falso alarme',cor:'--cinza',ordem:8},
  12:{nome:'Falso alerta',cor:'--cinza',ordem:8}
};
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function infoEstado(o){
  const e = ESTADOS[o.estadoCode];
  if (e) return {...e, nome:o.estado || e.nome, hex:cssVar(e.cor)};
  const hex = o.cor ? '#' + String(o.cor).replace('#','') : cssVar('--cinza');
  return {nome:o.estado || 'Sem estado', hex, ordem:9};
}
 
/* ---------- Utilitários ---------- */
const $ = id => document.getElementById(id);
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/^uniao das freguesias de\s+/,'').replace(/\s+/g,' ').trim();
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = d => d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
 
function haQuanto(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  const min = Math.round((Date.now()-d)/60000);
  if (min < 1) return 'agora';
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min/60), m = min%60;
  return h < 24 ? `há ${h}h${m?String(m).padStart(2,'0'):''}` : d.toLocaleDateString('pt-PT') + ' ' + hhmm(d);
}
 
const ICONES = {
  op:'<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg>',
  ter:'<svg viewBox="0 0 24 24"><path d="M3 6h11v8h2l3-4h2v7h-1.5a2.5 2.5 0 0 1-5 0h-5a2.5 2.5 0 0 1-5 0H3V6zm3.5 12.3a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm10 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>',
  aer:'<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>'
};
 
/* ---------- Relógio ---------- */
function relogio(){
  const d = new Date();
  $('hora').textContent = d.toLocaleTimeString('pt-PT');
  $('data').textContent = d.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(relogio,1000); relogio();
 
/* ---------- Emblema ---------- */
(function(){
  const img = $('emblema');
  img.onerror = () => { img.style.display='none'; $('emblemaAlt').style.display='flex'; };
  img.src = CONFIG.EMBLEMA;
})();
 
/* ---------- Mapa (vista bloqueada) ---------- */
const mapa = L.map('mapa',{
  zoomControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false, zoomSnap:0.1,
  boxZoom:false, keyboard:false, touchZoom:false, tap:false, attributionControl:true
});
/* Fundos de mapa sem chave: OpenStreetMap; se falhar, Esri World Street Map */
const FUNDOS = [
  {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt:{maxZoom:19, attribution:'&copy; OpenStreetMap'}},
  {url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', opt:{maxZoom:19, attribution:'Tiles &copy; Esri'}}
];
let fundoAtual = 0, errosFundo = 0, camadaFundo = null;
function usarFundo(i){
  if (camadaFundo) mapa.removeLayer(camadaFundo);
  fundoAtual = i; errosFundo = 0;
  camadaFundo = L.tileLayer(FUNDOS[i].url, FUNDOS[i].opt).addTo(mapa);
  camadaFundo.on('tileerror', () => {
    if (++errosFundo >= 4 && fundoAtual < FUNDOS.length - 1) usarFundo(fundoAtual + 1);
  });
}
usarFundo(0);
 
let limites = L.latLngBounds(CONFIG.LIMITES_RESERVA);
let contorno = null;
function enquadrar(){ mapa.invalidateSize(); mapa.fitBounds(window._vista || limites,{padding:[8,8]}); }
enquadrar();
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(enquadrar,150); });
 
let nomesFreguesias = [];
 
async function carregarContorno(){
  // 1) cópia guardada no navegador (30 dias)
  try{
    const c = JSON.parse(localStorage.getItem('braga_contorno') || 'null');
    if (c && Date.now() - c.t < 30*864e5){ desenharContorno(c.gj); nomesFreguesias = c.fr || []; return; }
  }catch(e){}
 
  let gj = null, fr = [];
  // 2) GeoAPI.pt
  try{
    const r = await fetch('https://json.geoapi.pt/municipio/Braga');
    let j = await r.json(); if (Array.isArray(j)) j = j[0];
    gj = (j.geojsons && j.geojsons.municipio) || j.geojson || null;
    if (j.geojsons && Array.isArray(j.geojsons.freguesias))
      fr = j.geojsons.freguesias.map(f => (f.properties && (f.properties.Freguesia || f.properties.freguesia || f.properties.nome)) || '').filter(Boolean);
    else if (Array.isArray(j.freguesias)) fr = j.freguesias;
  }catch(e){}
  // 3) OpenStreetMap (Nominatim)
  if (!gj){
    try{
      const u = 'https://nominatim.openstreetmap.org/search?format=geojson&polygon_geojson=1&polygon_threshold=0.0002&countrycodes=pt&q=' + encodeURIComponent('Braga, Braga, Portugal');
      const j = await (await fetch(u)).json();
      const feats = (j.features||[]).filter(f => /Polygon/.test(f.geometry && f.geometry.type));
      const mun = feats.find(f => f.properties && f.properties.addresstype === 'municipality') || feats[0];
      if (mun) gj = mun;
    }catch(e){}
  }
  if (gj){
    desenharContorno(gj);
    try{ localStorage.setItem('braga_contorno', JSON.stringify({t:Date.now(), gj, fr})); }catch(e){}
  }
  nomesFreguesias = fr;
}
 
function desenharContorno(gj){
  try{
    contorno = L.geoJSON(gj,{style:{color:cssVar('--azul'),weight:3,fill:false,interactive:false}}).addTo(mapa);
    // máscara: escurece tudo o que está fora do concelho
    const aneis = [];
    const juntar = g => {
      if (!g) return;
      if (g.type === 'FeatureCollection') g.features.forEach(f => juntar(f.geometry));
      else if (g.type === 'Feature') juntar(g.geometry);
      else if (g.type === 'Polygon') aneis.push(g.coordinates[0]);
      else if (g.type === 'MultiPolygon') g.coordinates.forEach(pl => aneis.push(pl[0]));
    };
    juntar(gj);
    if (aneis.length){
      const mundo = [[85,-180],[85,180],[-85,180],[-85,-180]];
      L.polygon([mundo, ...aneis.map(a => a.map(([x,y]) => [y,x]))],
        {stroke:false, fillColor:'#0D1826', fillOpacity:.55, interactive:false}).addTo(mapa);
      contorno.bringToFront();
    }
    const b = contorno.getBounds(); if (b.isValid()){ limites = b; enquadrar(); }
  }catch(e){}
}

/* ---------- Freguesias: correspondência de nomes ---------- */
const chaveFreg = n => norm(n).replace(/^uniao das freguesias de\s+/,'').replace(/^uf\s+/,'')
  .replace(/[(),.\-]/g,' ').replace(/\s+/g,' ').trim();
const CHAVES_FREG = FREGUESIAS.map(n => ({nome:n, k:chaveFreg(n)}));
function fregCanonica(nome){
  if (!nome) return '';
  const k = chaveFreg(nome);
  let f = CHAVES_FREG.find(x => x.k === k);
  const palavra = (a, b) => new RegExp('(^| )' + b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '( |$)').test(a);
  if (!f && k.length >= 4) f = CHAVES_FREG.find(x => palavra(x.k, k) || palavra(k, x.k));
  return f ? f.nome : nome;
}

/* ---------- Quartéis e distâncias ---------- */
const quarteis = (CONFIG.QUARTEIS||[]).filter(q => isFinite(q.lat) && isFinite(q.lng) && q.lat !== null);
const camadaQuarteis = L.layerGroup().addTo(mapa);
quarteis.forEach(q => {
  L.marker([q.lat,q.lng],{
    icon:L.divIcon({className:'',iconSize:[0,0],html:`<span class="quartel">${esc(q.sigla)}</span>`}),
    keyboard:false, zIndexOffset:-100
  }).bindPopup(`<b>${esc(q.sigla)}</b><br>${esc(q.nome)}`,{autoPan:false}).addTo(camadaQuarteis);
});

const distCache = {};   // id -> [{km, min, estrada}] por quartel
function linhaReta(a, b){
  const R = 6371, r = x => x*Math.PI/180;
  const dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function distancias(o){
  if (!quarteis.length || o.lat == null || o.lng == null) return null;
  return distCache[o.id] || quarteis.map(q => ({km:linhaReta(q,o), min:null, estrada:false}));
}
async function calcularDistancias(){
  if (!CONFIG.DISTANCIA_ESTRADA || !quarteis.length) return;
  const falta = [...ocorrencias, ...vizinhas].filter(o => o.lat != null && o.lng != null && !distCache[o.id]).slice(0, 80);
  if (!falta.length) return;
  const pts = [...quarteis, ...falta].map(p => `${(+p.lng).toFixed(6)},${(+p.lat).toFixed(6)}`).join(';');
  const src = quarteis.map((_,i) => i).join(';');
  const dst = falta.map((_,i) => i + quarteis.length).join(';');
  try{
    const r = await fetch(`https://router.project-osrm.org/table/v1/driving/${pts}?sources=${src}&destinations=${dst}&annotations=distance,duration`);
    const j = await r.json();
    if (j.code !== 'Ok') throw new Error(j.code);
    falta.forEach((o, d) => {
      distCache[o.id] = quarteis.map((q, s) => {
        const m = j.distances[s][d], t = j.durations[s][d];
        return (m == null) ? {km:linhaReta(q,o), min:null, estrada:false} : {km:m/1000, min:t/60, estrada:true};
      });
    });
    desenhar();
  }catch(e){ /* sem rota: fica a linha reta */ }
}
const fmtKm = km => km.toLocaleString('pt-PT',{maximumFractionDigits:1, minimumFractionDigits:1});
function htmlDist(o){
  const d = distancias(o); if (!d) return '';
  const crit = x => x.min ?? x.km;
  const melhor = d.reduce((a,x,i) => crit(x) < crit(d[a]) ? i : a, 0);
  return '<span class="dist">' + d.map((x,i) =>
    `<span class="q${i===melhor?' perto':''}" title="${x.estrada?'Por estrada':'Em linha reta'}"><b>${esc(quarteis[i].sigla)}</b>${x.estrada?'':'≈ '}${fmtKm(x.km)} km${x.min!=null?' · '+Math.round(x.min)+' min':''}</span>`
  ).join('') + '</span>';
}
function textoDist(o){
  const d = distancias(o); if (!d) return '';
  return d.map((x,i) => `${quarteis[i].sigla}: ${x.estrada?'':'≈ '}${fmtKm(x.km)} km${x.min!=null?' · '+Math.round(x.min)+' min':''}`).join('<br>');
}

/* ---------- Alertas de nova ocorrência ---------- */
let alertasAtivos = false, audioCtx = null, primeiraCarga = true, piscaTitulo = null;
const tituloOriginal = document.title;
const aPiscar = new Set();
let vistos = {};
try { vistos = JSON.parse(localStorage.getItem('oc_vistos') || '{}'); } catch(e){}

const btnAlertas = $('btnAlertas');
btnAlertas.classList.add('convite');
btnAlertas.addEventListener('click', () => {
  if (!alertasAtivos){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();
      alertasAtivos = true;
      tocar(1);
    }catch(e){ alertasAtivos = false; }
  } else {
    alertasAtivos = false;
  }
  btnAlertas.textContent = alertasAtivos ? '🔔 Alertas ativos' : '🔕 Ativar alertas';
  btnAlertas.setAttribute('aria-pressed', alertasAtivos);
  btnAlertas.classList.toggle('convite', !alertasAtivos);
});

function tocar(repeticoes){
  if (!alertasAtivos || !audioCtx) return;
  const t0 = audioCtx.currentTime + 0.05;
  for (let r = 0; r < repeticoes; r++){
    [[880,0],[660,0.22]].forEach(([f,d]) => {
      const t = t0 + r*0.6 + d;
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.21);
    });
  }
}

function verificarNovas(){
  const agora = Date.now(), novas = [];
  [...ocorrencias, ...vizinhas].forEach(o => {
    if (vistos[o.id]) return;
    if (primeiraCarga){
      // ao abrir a página, usa a hora de início para não marcar como novas as ocorrências antigas
      const ini = Date.parse(o.inicio);
      vistos[o.id] = isNaN(ini) ? agora : Math.min(ini, agora);
    } else {
      vistos[o.id] = agora;
      if (o.dico === CONFIG.DICO) novas.push(o);
    }
  });
  Object.keys(vistos).forEach(k => { if (agora - vistos[k] > 3*864e5) delete vistos[k]; });
  try { localStorage.setItem('oc_vistos', JSON.stringify(vistos)); } catch(e){}
  primeiraCarga = false;
  if (novas.length) alertar(novas);
}

function alertar(novas){
  tocar(3);
  novas.forEach(o => aPiscar.add(o.id));
  setTimeout(() => { novas.forEach(o => aPiscar.delete(o.id)); desenhar(); }, 6000);
  clearInterval(piscaTitulo);
  const aviso = '🔴 NOVA: ' + (novas[0].natureza || 'ocorrência') + (novas.length > 1 ? ' (+' + (novas.length-1) + ')' : '');
  let alt = false, n = 0;
  piscaTitulo = setInterval(() => {
    document.title = (alt = !alt) ? aviso : tituloOriginal;
    if (++n > 240){ clearInterval(piscaTitulo); document.title = tituloOriginal; }
  }, 1000);
}
['click','keydown','focus'].forEach(ev => window.addEventListener(ev, () => {
  if (piscaTitulo){ clearInterval(piscaTitulo); piscaTitulo = null; document.title = tituloOriginal; }
}));

function desenhar(){
  const filtro = $('freguesia').value;
  const listaB = ocorrencias
    .filter(o => !filtro || (o._freg || fregCanonica(o.freguesia)) === filtro)
    .map(o => ({o, e:infoEstado(o)})).sort(ordenar);
  const listaV = (mostrarVizinhos && !filtro)
    ? vizinhas.map(o => ({o, e:infoEstado(o)}))
        .sort((a,b) => String((CONFIG.VIZINHOS||{})[a.o.dico]).localeCompare(String((CONFIG.VIZINHOS||{})[b.o.dico]),'pt') || ordenar(a,b))
    : [];

  const cont = $('contador');
  cont.textContent = listaB.length;
  cont.classList.toggle('ativo', listaB.length > 0);
  btnVizinhos.textContent = 'Concelhos vizinhos' + (jaRecebeuDados ? ` (${vizinhas.length})` : '');
  btnVizinhos.setAttribute('aria-pressed', mostrarVizinhos);

  const el = $('lista');
  let html = '';
  if (!listaB.length){
    html = !jaRecebeuDados
      ? `<div class="vazio"><strong>A aguardar dados</strong>A lista aparece assim que a fonte responder.</div>`
      : `<div class="vazio"${listaV.length?' style="margin:12px auto"':''}><strong>Sem ocorrências ativas</strong>${filtro ? 'nesta freguesia.' : 'no concelho de Braga neste momento.'}</div>`;
  } else {
    html = listaB.map(x => itemHtml(x, false)).join('');
  }
  if (mostrarVizinhos && !filtro && jaRecebeuDados){
    html += `<div class="secao">Concelhos vizinhos (${listaV.length})</div>`;
    html += listaV.length ? listaV.map(x => itemHtml(x, true)).join('') : '<div class="vazio" style="margin:6px auto;padding:10px">Sem ocorrências ativas nos concelhos vizinhos.</div>';
  }
  el.innerHTML = html;

  camada.clearLayers();
  camadaLinhas.clearLayers();
  Object.keys(marcadores).forEach(k => delete marcadores[k]);
  [...listaB.map(x => [x,false]), ...listaV.map(x => [x,true])].forEach(([{o,e}, viz]) => {
    if (o.lat == null || o.lng == null) return;
    const icon = L.divIcon({
      className:'', iconSize:[22,22], iconAnchor:[11,11],
      html:`<div class="marcador${viz?' viz':''}${e.pulsa&&!viz?' pulsa':''}${selecionada===o.id?' sel':''}" style="--c:${e.hex}"><div class="ponto"></div></div>`
    });
    const m = L.marker([o.lat,o.lng],{icon, keyboard:false, zIndexOffset: viz ? -50 : 0}).addTo(camada);
    const inicio = o.inicio ? new Date(o.inicio).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    const dist = textoDist(o);
    const local = viz ? [(CONFIG.VIZINHOS||{})[o.dico], o.freguesia, o.localidade] : [o._freg || o.freguesia, o.localidade];
    m.bindPopup(`<b>${esc(o.natureza||'Ocorrência')}</b><br>${esc(e.nome)}<br>${esc(local.filter(Boolean).join(' — '))}<br>Início: ${inicio}<br>Op. ${o.operacionais} · Terr. ${o.terrestres} · Aér. ${o.aereos}${dist?'<br>'+dist:''}`,{autoPan:false});
    m.on('click', () => selecionar(o.id, false));
    marcadores[o.id] = m;
    if (selecionada === o.id) quarteis.forEach(q =>
      L.polyline([[q.lat,q.lng],[o.lat,o.lng]],{color:cssVar('--azul'),weight:2,dashArray:'6 6',interactive:false}).addTo(camadaLinhas));
  });

  // vista: freguesia escolhida, Braga, ou Braga + ocorrências vizinhas
  realcarFreguesia(filtro);
  let vista = (filtro && geoFreg[filtro] && geoFreg[filtro].bounds) ? geoFreg[filtro].bounds : limites;
  const pts = listaV.filter(x => x.o.lat != null && x.o.lng != null).map(x => [x.o.lat, x.o.lng]);
  if (pts.length) vista = L.latLngBounds(limites.getSouthWest(), limites.getNorthEast()).extend(L.latLngBounds(pts));
  const chave = vista.toBBoxString();
  if (chave !== window._vistaChave){ window._vistaChave = chave; window._vista = vista; enquadrar(); }

  el.querySelectorAll('.oc').forEach(b => b.addEventListener('click', () => selecionar(b.dataset.id, true)));
}

function selecionar(id, abrirPopup){
  selecionada = (selecionada === id && abrirPopup) ? null : id;
  desenhar();
  if (selecionada && abrirPopup && marcadores[id]) marcadores[id].openPopup();
  const b = document.querySelector(`.oc[data-id="${CSS.escape(id)}"]`);
  if (b) b.scrollIntoView({block:'nearest'});
}

/* ---------- Limites e nomes das freguesias (OpenStreetMap) ---------- */
const camadaFreg = L.layerGroup().addTo(mapa);
const geoFreg = {};   // nome canónico -> {linhas:[L.polyline], rotulo:L.marker, bounds}
const nomeCurto = n => n.replace(/^Braga \((.*)\)$/,'$1');

async function carregarFreguesias(){
  let lista = null;
  try{
    const c = JSON.parse(localStorage.getItem('braga_freguesias_v1') || 'null');
    if (c && Date.now() - c.t < 60*864e5) lista = c.l;
  }catch(e){}
  if (!lista){
    try{
      const q = '[out:json][timeout:60];area["boundary"="administrative"]["admin_level"="7"]["name"="Braga"]->.m;'
              + 'rel(area.m)["boundary"="administrative"]["admin_level"="8"];out geom;';
      const r = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:'data=' + encodeURIComponent(q)});
      const j = await r.json();
      lista = (j.elements||[]).filter(e => e.type === 'relation' && e.tags && e.tags.name).map(rel => {
        const linhas = []; let lbl = null;
        (rel.members||[]).forEach(m => {
          if (m.type === 'way' && m.geometry && m.role !== 'subarea')
            linhas.push(m.geometry.map(p => [+p.lat.toFixed(5), +p.lon.toFixed(5)]));
          if (m.type === 'node' && !lbl && (m.role === 'label' || m.role === 'admin_centre') && m.lat != null)
            lbl = [m.lat, m.lon];
        });
        if (!lbl && rel.bounds) lbl = [(rel.bounds.minlat+rel.bounds.maxlat)/2, (rel.bounds.minlon+rel.bounds.maxlon)/2];
        return {n: fregCanonica(rel.tags.name), l: linhas, c: lbl};
      }).filter(f => f.l.length);
      if (lista.length) { try{ localStorage.setItem('braga_freguesias_v1', JSON.stringify({t:Date.now(), l:lista})); }catch(e){} }
    }catch(e){ lista = null; }
  }
  if (lista) desenharFreguesias(lista);
}

function desenharFreguesias(lista){
  camadaFreg.clearLayers();
  lista.forEach(f => {
    const linhas = f.l.map(l => L.polyline(l, {color:'#24507F', weight:1.4, opacity:.75, dashArray:'5 4', interactive:false}).addTo(camadaFreg));
    let bounds = null;
    linhas.forEach(pl => { bounds = bounds ? bounds.extend(pl.getBounds()) : pl.getBounds(); });
    const rotulo = f.c ? L.marker(f.c, {
      icon: L.divIcon({className:'rotulo-freg', iconSize:null, html:`<span>${esc(nomeCurto(f.n))}</span>`}),
      interactive:false, keyboard:false, zIndexOffset:-500
    }).addTo(camadaFreg) : null;
    geoFreg[f.n] = {linhas, rotulo, bounds};
  });
  if (contorno) contorno.bringToFront();
  realcarFreguesia($('freguesia').value);
}

let fregRealcada = '';
function realcarFreguesia(nome){
  if (nome === fregRealcada) return;
  const antiga = geoFreg[fregRealcada];
  if (antiga){
    antiga.linhas.forEach(pl => pl.setStyle({color:'#24507F', weight:1.4, opacity:.75, dashArray:'5 4'}));
    if (antiga.rotulo) L.DomUtil.removeClass(antiga.rotulo.getElement() || document.createElement('i'), 'realce');
  }
  fregRealcada = nome;
  const nova = geoFreg[nome];
  if (nova){
    nova.linhas.forEach(pl => { pl.setStyle({color:cssVar('--azul'), weight:3.5, opacity:1, dashArray:null}); pl.bringToFront(); });
    if (nova.rotulo && nova.rotulo.getElement()) L.DomUtil.addClass(nova.rotulo.getElement(), 'realce');
  }
}

/* ---------- Arranque ---------- */
(async function(){
  await carregarContorno();
  carregarFreguesias().then(() => desenhar());
  await carregarDados();
  setInterval(carregarDados, CONFIG.ATUALIZAR_SEG * 1000);
  setInterval(desenhar, 60000); // atualiza os "há X min"
})();
</script>
