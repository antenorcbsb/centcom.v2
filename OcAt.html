
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocorrências ativas · Concelho de Braga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ============ CONFIGURAÇÃO VISUAL ============ */
:root{
  --fundo:#0D1826;
  --painel:#132235;
  --painel-2:#1A2C43;
  --linha:#263C57;
  --texto:#E8EEF5;
  --suave:#93A6BC;
  --azul:#3C8DFF;
  --vermelho:#E5483B;
  --laranja:#F07D2B;
  --ambar:#F2B13A;
  --verde:#3DBE7A;
  --cinza:#7D8CA0;
  --titulo:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --corpo:'Barlow','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--fundo);color:var(--texto);font-family:var(--corpo);
  font-size:15px;line-height:1.4;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  display:flex;flex-direction:column;overflow:hidden;
}
 
/* ============ BARRA SUPERIOR ============ */
.barra{
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:var(--painel);border-bottom:3px solid var(--vermelho);
  flex:0 0 auto;
}
.emblema{height:48px;width:auto}
.emblema-alt{
  height:44px;width:44px;border-radius:50%;border:2px solid var(--ambar);
  display:none;align-items:center;justify-content:center;
  font-family:var(--titulo);font-weight:700;font-size:13px;color:var(--ambar)
}
.titulos h1{font-family:var(--titulo);font-weight:700;font-size:26px;letter-spacing:.3px;line-height:1.05}
.titulos p{color:var(--suave);font-size:14px}
.relogio{margin-left:auto;text-align:right}
.relogio .hora{font-family:var(--titulo);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.relogio .data{color:var(--suave);font-size:13px}
 
/* ============ CORPO ============ */
.corpo{flex:1 1 auto;display:grid;grid-template-columns:minmax(320px,400px) 1fr;min-height:0}
.lateral{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--linha)}
 
.filtros{
  display:flex;gap:10px;align-items:center;padding:10px 14px;
  background:var(--painel);border-bottom:1px solid var(--linha)
}
.filtros select{
  flex:1;min-width:0;background:var(--painel-2);color:var(--texto);
  border:1px solid var(--linha);border-radius:6px;padding:7px 10px;font:inherit;font-size:14px
}
.filtros select:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
.contador{
  font-family:var(--titulo);font-weight:700;font-size:26px;line-height:1;
  min-width:44px;text-align:center;padding:4px 8px;border-radius:6px;
  background:var(--painel-2);border:1px solid var(--linha)
}
.contador.ativo{background:var(--vermelho);border-color:var(--vermelho)}
 
.estado-ligacao{padding:6px 14px;font-size:12.5px;color:var(--suave);border-bottom:1px solid var(--linha)}
.estado-ligacao.erro{color:#FFB4AC;background:rgba(229,72,59,.12)}
 
.lista{flex:1 1 auto;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
 
.oc{
  display:grid;grid-template-columns:5px 1fr;background:var(--painel);
  border:1px solid var(--linha);border-radius:6px;overflow:hidden;cursor:pointer;
  text-align:left;color:inherit;font:inherit;width:100%
}
.oc:hover,.oc.sel{border-color:var(--azul)}
.oc:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
.oc .faixa{background:var(--c,var(--cinza))}
.oc .conteudo{padding:9px 12px}
.oc .topo{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.oc .natureza{font-family:var(--titulo);font-weight:600;font-size:19px;line-height:1.1}
.oc .chip{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;
  color:var(--c,var(--cinza));border:1px solid var(--c,var(--cinza));white-space:nowrap
}
.oc .local{color:var(--suave);font-size:13.5px;margin-top:3px}
.oc .rodape{display:flex;gap:14px;margin-top:7px;font-size:13px;align-items:center;flex-wrap:wrap}
.oc .meio{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.oc .meio svg{width:15px;height:15px;fill:var(--suave)}
.oc .inicio{margin-left:auto;color:var(--suave)}
 
.vazio{margin:auto;text-align:center;color:var(--suave);padding:30px 16px}
.vazio strong{display:block;font-family:var(--titulo);font-size:21px;color:var(--texto);margin-bottom:4px}
 
.nota{padding:8px 14px;font-size:11.5px;color:var(--suave);border-top:1px solid var(--linha);background:var(--painel)}
 
/* ============ MAPA ============ */
.mapa-wrap{position:relative;min-height:0}
#mapa{position:absolute;inset:0;background:#dfe5ea}
.legenda{
  position:absolute;right:12px;bottom:12px;z-index:500;background:rgba(19,34,53,.92);
  border:1px solid var(--linha);border-radius:6px;padding:8px 12px;font-size:12.5px;
  display:flex;flex-direction:column;gap:4px
}
.legenda span{display:flex;align-items:center;gap:7px}
.legenda i{width:11px;height:11px;border-radius:50%;background:var(--c)}
 
.marcador{position:relative;width:22px;height:22px}
.marcador .ponto{
  position:absolute;inset:3px;border-radius:50%;background:var(--c);
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)
}
.marcador.pulsa::before{
  content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);
  animation:pulso 1.8s ease-out infinite
}
.marcador.sel .ponto{inset:0;border-width:3px}
@keyframes pulso{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.marcador.pulsa::before{animation:none;opacity:.35;transform:scale(1.5)}}
 
.leaflet-popup-content-wrapper{border-radius:6px}
.leaflet-popup-content{font-family:var(--corpo);font-size:13.5px;margin:10px 12px;color:#14202E}
.leaflet-popup-content b{font-family:var(--titulo);font-size:17px}
 
/* ============ ECRÃS PEQUENOS ============ */
@media (max-width:820px){
  body{overflow:auto}
  .corpo{grid-template-columns:1fr;grid-template-rows:auto auto}
  .mapa-wrap{height:55vh}
  .lateral{border-right:0;border-bottom:1px solid var(--linha)}
  .lista{max-height:none;overflow:visible}
  .mapa-wrap{order:-1}
  .relogio .data{display:none}
  .titulos h1{font-size:22px}
}
</style>
</head>
<body>
 
<header class="barra">
  <img class="emblema" id="emblema" alt="Emblema CENTCOM">
  <div class="emblema-alt" id="emblemaAlt">BSB</div>
  <div class="titulos">
    <h1>Ocorrências ativas</h1>
    <p>Concelho de Braga · CENTCOM</p>
  </div>
  <div class="relogio">
    <div class="hora" id="hora">--:--:--</div>
    <div class="data" id="data"></div>
  </div>
</header>
 
<main class="corpo">
  <section class="lateral" aria-label="Lista de ocorrências">
    <div class="filtros">
      <label for="freguesia" class="sr" style="position:absolute;left:-9999px">Freguesia</label>
      <select id="freguesia">
        <option value="">Todas as freguesias</option>
      </select>
      <div class="contador" id="contador" title="Ocorrências mostradas">0</div>
    </div>
    <div class="estado-ligacao" id="estadoLigacao">A ligar…</div>
    <div class="lista" id="lista" aria-live="polite"></div>
    <div class="nota">Fonte: Fogos.pt (dados ANEPC). Apoio à consciência situacional — não substitui os canais oficiais nem o sistema de despacho.</div>
  </section>
 
  <section class="mapa-wrap" aria-label="Mapa do concelho de Braga">
    <div id="mapa"></div>
    <div class="legenda">
      <span><i style="--c:var(--ambar)"></i>Despacho</span>
      <span><i style="--c:var(--vermelho)"></i>Em curso / chegada ao TO</span>
      <span><i style="--c:var(--verde)"></i>Em resolução / vigilância</span>
      <span><i style="--c:var(--cinza)"></i>Conclusão</span>
    </div>
  </section>
</main>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =====================================================
   CONFIGURAÇÃO — alterar só aqui
   ===================================================== */
const CONFIG = {
  // Endereço /exec do Apps Script "Intermediario Fogos"
  ENDPOINT: 'https://script.google.com/macros/s/AKfycbzVvoPqEBcY0HkyDbSXyqSOCy3b4pTg7KEIBXsAo7qow5B8hjlM3-QdAckbgfySf2iupA/exec',
  DICO: '0303',                 // concelho de Braga
  ATUALIZAR_SEG: 120,
  EMBLEMA: 'emblema.png',       // ficheiro do emblema no repositório
  // Limites aproximados do concelho (usados se o contorno não carregar)
  LIMITES_RESERVA: [[41.465, -8.535], [41.625, -8.305]]
};
 
/* ---------- Estados (códigos Fogos.pt) ---------- */
const ESTADOS = {
  3:{nome:'Despacho',cor:'--ambar',ordem:3},
  4:{nome:'Despacho de 1.º alerta',cor:'--ambar',ordem:3},
  5:{nome:'Em curso',cor:'--vermelho',ordem:1,pulsa:true},
  6:{nome:'Chegada ao TO',cor:'--laranja',ordem:2,pulsa:true},
  7:{nome:'Em resolução',cor:'--verde',ordem:4},
  8:{nome:'Conclusão',cor:'--cinza',ordem:6},
  9:{nome:'Vigilância',cor:'--verde',ordem:5},
  10:{nome:'Encerrada',cor:'--cinza',ordem:7},
  11:{nome:'Falso alarme',cor:'--cinza',ordem:8},
  12:{nome:'Falso alerta',cor:'--cinza',ordem:8}
};
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function infoEstado(o){
  const e = ESTADOS[o.estadoCode];
  if (e) return {...e, nome:o.estado || e.nome, hex:cssVar(e.cor)};
  const hex = o.cor ? '#' + String(o.cor).replace('#','') : cssVar('--cinza');
  return {nome:o.estado || 'Sem estado', hex, ordem:9};
}
 
/* ---------- Utilitários ---------- */
const $ = id => document.getElementById(id);
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/^uniao das freguesias de\s+/,'').replace(/\s+/g,' ').trim();
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = d => d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
 
function haQuanto(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  const min = Math.round((Date.now()-d)/60000);
  if (min < 1) return 'agora';
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min/60), m = min%60;
  return h < 24 ? `há ${h}h${m?String(m).padStart(2,'0'):''}` : d.toLocaleDateString('pt-PT') + ' ' + hhmm(d);
}
 
const ICONES = {
  op:'<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg>',
  ter:'<svg viewBox="0 0 24 24"><path d="M3 6h11v8h2l3-4h2v7h-1.5a2.5 2.5 0 0 1-5 0h-5a2.5 2.5 0 0 1-5 0H3V6zm3.5 12.3a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm10 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>',
  aer:'<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>'
};
 
/* ---------- Relógio ---------- */
function relogio(){
  const d = new Date();
  $('hora').textContent = d.toLocaleTimeString('pt-PT');
  $('data').textContent = d.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(relogio,1000); relogio();
 
/* ---------- Emblema ---------- */
(function(){
  const img = $('emblema');
  img.onerror = () => { img.style.display='none'; $('emblemaAlt').style.display='flex'; };
  img.src = CONFIG.EMBLEMA;
})();
 
/* ---------- Mapa (vista bloqueada) ---------- */
const mapa = L.map('mapa',{
  zoomControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false,
  boxZoom:false, keyboard:false, touchZoom:false, tap:false, attributionControl:true
});
/* Fundos de mapa sem chave: OpenStreetMap; se falhar, Esri World Street Map */
const FUNDOS = [
  {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt:{maxZoom:19, attribution:'&copy; OpenStreetMap'}},
  {url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', opt:{maxZoom:19, attribution:'Tiles &copy; Esri'}}
];
let fundoAtual = 0, errosFundo = 0, camadaFundo = null;
function usarFundo(i){
  if (camadaFundo) mapa.removeLayer(camadaFundo);
  fundoAtual = i; errosFundo = 0;
  camadaFundo = L.tileLayer(FUNDOS[i].url, FUNDOS[i].opt).addTo(mapa);
  camadaFundo.on('tileerror', () => {
    if (++errosFundo >= 4 && fundoAtual < FUNDOS.length - 1) usarFundo(fundoAtual + 1);
  });
}
usarFundo(0);
 
let limites = L.latLngBounds(CONFIG.LIMITES_RESERVA);
let contorno = null;
function enquadrar(){ mapa.invalidateSize(); mapa.fitBounds(limites,{padding:[18,18]}); }
enquadrar();
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(enquadrar,150); });
 
let nomesFreguesias = [];
 
async function carregarContorno(){
  // 1) cópia guardada no navegador (30 dias)
  try{
    const c = JSON.parse(localStorage.getItem('braga_contorno') || 'null');
    if (c && Date.now() - c.t < 30*864e5){ desenharContorno(c.gj); nomesFreguesias = c.fr || []; return; }
  }catch(e){}
 
  let gj = null, fr = [];
  // 2) GeoAPI.pt
  try{
    const r = await fetch('https://json.geoapi.pt/municipio/Braga');
    let j = await r.json(); if (Array.isArray(j)) j = j[0];
    gj = (j.geojsons && j.geojsons.municipio) || j.geojson || null;
    if (j.geojsons && Array.isArray(j.geojsons.freguesias))
      fr = j.geojsons.freguesias.map(f => (f.properties && (f.properties.Freguesia || f.properties.freguesia || f.properties.nome)) || '').filter(Boolean);
    else if (Array.isArray(j.freguesias)) fr = j.freguesias;
  }catch(e){}
  // 3) OpenStreetMap (Nominatim)
  if (!gj){
    try{
      const u = 'https://nominatim.openstreetmap.org/search?format=geojson&polygon_geojson=1&polygon_threshold=0.0002&countrycodes=pt&q=' + encodeURIComponent('Braga, Braga, Portugal');
      const j = await (await fetch(u)).json();
      const feats = (j.features||[]).filter(f => /Polygon/.test(f.geometry && f.geometry.type));
      const mun = feats.find(f => f.properties && f.properties.addresstype === 'municipality') || feats[0];
      if (mun) gj = mun;
    }catch(e){}
  }
  if (gj){
    desenharContorno(gj);
    try{ localStorage.setItem('braga_contorno', JSON.stringify({t:Date.now(), gj, fr})); }catch(e){}
  }
  nomesFreguesias = fr;
}
 
function desenharContorno(gj){
  try{
    contorno = L.geoJSON(gj,{style:{color:cssVar('--azul'),weight:3,fill:true,fillOpacity:.04,interactive:false}}).addTo(mapa);
    const b = contorno.getBounds(); if (b.isValid()){ limites = b; enquadrar(); }
  }catch(e){}
}
 
/* ---------- Dados ---------- */
let ocorrencias = [];
let jaRecebeuDados = false;
let selecionada = null;
const camada = L.layerGroup().addTo(mapa);
const marcadores = {};
 
async function carregarDados(){
  const el = $('estadoLigacao');
  if (!CONFIG.ENDPOINT || CONFIG.ENDPOINT.startsWith('COLE_AQUI')){
    el.textContent = 'Falta o endereço /exec do intermediário em CONFIG.ENDPOINT.';
    el.className = 'estado-ligacao erro'; desenhar(); return;
  }
  try{
    const url = CONFIG.ENDPOINT + (CONFIG.ENDPOINT.includes('?')?'&':'?') + 'dico=' + CONFIG.DICO + '&_=' + Date.now();
    const j = await (await fetch(url)).json();
    if (!j.ok) throw new Error(j.erro || 'Resposta inválida do intermediário.');
    ocorrencias = (j.ocorrencias||[]).filter(o => String(o.dico).padStart(4,'0') === CONFIG.DICO);
    jaRecebeuDados = true;
    if (j.desatualizado){
      el.textContent = 'Dados de ' + hhmm(new Date(j.atualizado)) + ' — a fonte limitou os pedidos; nova tentativa automática.';
      el.className = 'estado-ligacao erro';
    } else {
      el.textContent = 'Atualizado às ' + hhmm(new Date(j.atualizado || Date.now())) + ' · atualiza a cada ' + CONFIG.ATUALIZAR_SEG + ' s';
      el.className = 'estado-ligacao';
    }
  }catch(err){
    const limite = /429|limite/i.test(err.message);
    el.textContent = (limite
        ? 'A fonte Fogos.pt limitou os pedidos. ' + err.message.replace(/^.*?(até|depois das)\s*/i,'Nova tentativa depois das ').replace(/\.+\)?\.?$/,'') + '.'
        : 'Erro ao ler os dados: ' + err.message)
      + (jaRecebeuDados ? ' A mostrar os últimos dados recebidos.' : '');
    el.className = 'estado-ligacao erro';
  }
  atualizarFiltro(); desenhar();
}
 
/* ---------- Filtro por freguesia ---------- */
function atualizarFiltro(){
  const sel = $('freguesia'), atual = sel.value;
  const mapaNomes = new Map();
  nomesFreguesias.forEach(n => mapaNomes.set(norm(n), n.replace(/^União das freguesias de\s+/i,'')));
  ocorrencias.forEach(o => { if (o.freguesia && !mapaNomes.has(norm(o.freguesia))) mapaNomes.set(norm(o.freguesia), o.freguesia); });
  const contagem = {};
  ocorrencias.forEach(o => { const k = norm(o.freguesia); contagem[k] = (contagem[k]||0) + 1; });
  const ordenadas = [...mapaNomes.entries()].sort((a,b) => a[1].localeCompare(b[1],'pt'));
  sel.innerHTML = '<option value="">Todas as freguesias</option>' +
    ordenadas.map(([k,n]) => `<option value="${esc(k)}">${esc(n)}${contagem[k]?' ('+contagem[k]+')':''}</option>`).join('');
  sel.value = mapaNomes.has(atual) ? atual : '';
}
$('freguesia').addEventListener('change', () => { selecionada = null; desenhar(); });
 
/* ---------- Desenho da lista e do mapa ---------- */
function desenhar(){
  const filtro = $('freguesia').value;
  const lista = ocorrencias
    .filter(o => !filtro || norm(o.freguesia) === filtro)
    .map(o => ({o, e:infoEstado(o)}))
    .sort((a,b) => a.e.ordem - b.e.ordem || String(b.o.inicio).localeCompare(String(a.o.inicio)));
 
  const cont = $('contador');
  cont.textContent = lista.length;
  cont.classList.toggle('ativo', lista.length > 0);
 
  const el = $('lista');
  if (!lista.length){
    el.innerHTML = !jaRecebeuDados
      ? `<div class="vazio"><strong>A aguardar dados</strong>A lista aparece assim que a fonte responder.</div>`
      : `<div class="vazio"><strong>Sem ocorrências ativas</strong>${filtro ? 'nesta freguesia.' : 'no concelho de Braga neste momento.'}</div>`;
  } else {
    el.innerHTML = lista.map(({o,e}) => `
      <button class="oc${selecionada===o.id?' sel':''}" style="--c:${e.hex}" data-id="${esc(o.id)}">
        <span class="faixa"></span>
        <span class="conteudo">
          <span class="topo">
            <span class="natureza">${esc(o.natureza || 'Ocorrência')}</span>
            <span class="chip">${esc(e.nome)}</span>
          </span>
          <span class="local" style="display:block">${esc([o.freguesia, o.localidade].filter(Boolean).join(' — ') || 'Local não indicado')}</span>
          <span class="rodape">
            <span class="meio" title="Operacionais">${ICONES.op}${o.operacionais}</span>
            <span class="meio" title="Meios terrestres">${ICONES.ter}${o.terrestres}</span>
            <span class="meio" title="Meios aéreos">${ICONES.aer}${o.aereos}</span>
            <span class="inicio">${esc(haQuanto(o.inicio))}</span>
          </span>
        </span>
      </button>`).join('');
  }
 
  camada.clearLayers();
  Object.keys(marcadores).forEach(k => delete marcadores[k]);
  lista.forEach(({o,e}) => {
    if (o.lat == null || o.lng == null) return;
    const icon = L.divIcon({
      className:'', iconSize:[22,22], iconAnchor:[11,11],
      html:`<div class="marcador${e.pulsa?' pulsa':''}${selecionada===o.id?' sel':''}" style="--c:${e.hex}"><div class="ponto"></div></div>`
    });
    const m = L.marker([o.lat,o.lng],{icon, keyboard:false}).addTo(camada);
    const inicio = o.inicio ? new Date(o.inicio).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    m.bindPopup(`<b>${esc(o.natureza||'Ocorrência')}</b><br>${esc(e.nome)}<br>${esc([o.freguesia,o.localidade].filter(Boolean).join(' — '))}<br>Início: ${inicio}<br>Op. ${o.operacionais} · Terr. ${o.terrestres} · Aér. ${o.aereos}`,{autoPan:false});
    m.on('click', () => selecionar(o.id, false));
    marcadores[o.id] = m;
  });
 
  el.querySelectorAll('.oc').forEach(b => b.addEventListener('click', () => selecionar(b.dataset.id, true)));
}
 
function selecionar(id, abrirPopup){
  selecionada = (selecionada === id && abrirPopup) ? null : id;
  desenhar();
  if (selecionada && abrirPopup && marcadores[id]) marcadores[id].openPopup();
  const b = document.querySelector(`.oc[data-id="${CSS.escape(id)}"]`);
  if (b) b.scrollIntoView({block:'nearest'});
}
 
/* ---------- Arranque ---------- */
(async function(){
  await carregarContorno();
  await carregarDados();
  setInterval(carregarDados, CONFIG.ATUALIZAR_SEG * 1000);
  setInterval(desenhar, 60000); // atualiza os "há X min"
})();
</script>
